name: CS170Walkthrough
options:
  bundleIdPrefix: com.alexdils
  deploymentTarget:
    iOS: "18.0"
targets:
  CS170Walkthrough:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # The web app ships as-is. renderer/ and content/ must stay siblings in the bundle
      # because renderer/app.js imports ../content/index.js.
      - path: ../renderer
        type: folder
        buildPhase: resources
      - path: ../content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexdils.cs170walkthrough
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CS 170
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3WKAG55LV4
schemes:
  CS170Walkthrough:
    build:
      targets:
        CS170Walkthrough: all
