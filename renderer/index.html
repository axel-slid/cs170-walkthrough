<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CS 170 Walkthrough</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Shared arrowheads for every figure. Kept rendered (not display:none) so markers resolve. -->
  <svg class="defs" aria-hidden="true">
    <defs>
      <marker id="ah-plain" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-plain"/></marker>
      <marker id="ah-accent" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-accent"/></marker>
      <marker id="ah-good" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-good"/></marker>
      <marker id="ah-warn" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-warn"/></marker>
      <marker id="ah-bad" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-bad"/></marker>
      <marker id="ah-muted" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-muted"/></marker>
    </defs>
  </svg>

  <aside id="sidebar">
    <div class="drag"></div>
    <div class="side-head">
      <button class="exam-picker exam-btn" id="exam-btn" aria-haspopup="listbox" title="Choose an exam or worksheet"><span class="ring-wrap" id="exam-btn-ring"></span><span class="exam-btn-label" id="exam-btn-label"></span><svg class="exam-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
      <div id="exam-menu" role="listbox" hidden></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="side-links">
        <button class="side-link" id="shop-btn"><span class="coin"></span> Shop</button>
        <button class="side-link gear" id="settings-btn" title="Settings (⌘,)" aria-label="Settings"><svg class="sym-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
      <div class="overall" id="overall"></div>
    </div>
  </aside>

  <section id="main">
    <div id="toolbar">
      <button class="tb-btn sym" id="side-btn" title="Hide the sidebar (⌘\)" aria-label="Toggle sidebar"><svg class="sym-i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9.5 4.5v15"/><path d="M5.5 8.5h2M5.5 11.5h2"/></svg></button>
      <div class="nav-btns">
        <button class="tb-btn icon" id="prev-btn" title="Previous part (⌘[)">&#8249;</button>
        <button class="tb-btn icon" id="next-btn" title="Next part (⌘])">&#8250;</button>
      </div>
      <span class="title" id="tb-title">&nbsp;</span>
      <span class="spacer"></span>
      <span class="streak" id="streak" hidden title="Correct answers in a row"></span>
      <span class="test-clock" id="test-clock" hidden title="Time"></span>
      <button class="tb-btn test-submit" id="test-submit" hidden>Submit test</button>
      <button class="coin-pill" id="coin-btn" title="Your coins. Click to open the shop."><span class="coin"></span><span id="coin-count">0</span></button>
      <button class="tb-btn sym" id="test-btn" title="Test mode: timed, no hints, graded at the end" aria-label="Test mode"><svg class="sym-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M10 2.8h4M12 2.8V6M18.2 6.8l1.4-1.4"/></svg></button>
      <button class="tb-btn sym" id="hints-btn" title="No-hints mode: hide the Hint lines and the guided steps, answer first, then check (⇧⌘H)" aria-label="No hints"><svg class="sym-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/><path d="M4 4l16 16"/></svg></button>
      <button class="tb-btn sym" id="ink-btn" title="Write on the page (the Apple Pencil always writes; this shows colors, eraser and undo)" aria-label="Ink"><svg class="sym-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.4L15.8 5a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.4 18.8z"/><path d="M13.5 7.3l3.2 3.2"/></svg></button>
      <button class="tb-btn sym" id="paper-btn" hidden title="Apple Pencil paper for this part" aria-label="Paper"><svg class="sym-i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></button>
      <button class="tb-btn sym" id="solution-btn" title="The official answer key for this question (⌘J)" aria-label="Staff solution"><svg class="sym-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14.5l2 2 4-4"/></svg></button>
      <button class="tb-btn sym" id="reset-btn" title="Hide all steps again (⌘⌫)" aria-label="Start over"><svg class="sym-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
      <button class="tb-btn sym strong" id="all-btn" title="Reveal every step (⇧↩)" aria-label="Show everything"><svg class="sym-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="tb-btn sym" id="more-btn" hidden title="More" aria-label="More"><svg class="sym-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></svg></button>
      <div id="more-menu" hidden></div>
    </div>

    <div id="scroll"><div class="page" id="page"></div></div>

    <div id="solution" hidden>
      <div class="sol-bar">
        <div>
          <div class="sol-title" id="sol-title"></div>
          <div class="sol-sub" id="sol-sub"></div>
        </div>
        <span class="spacer"></span>
        <button class="tb-btn strong" id="sol-close">Done</button>
      </div>
      <div class="sol-scroll" id="sol-scroll"></div>
    </div>

  </section>

  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
